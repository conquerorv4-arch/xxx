name: Build Tweak

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make libssl-dev dpkg-dev git wget curl
          sudo curl -L -o /usr/bin/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          sudo chmod +x /usr/bin/ldid

      - name: Clone Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git /opt/theos

      - name: Create ext/fonts structure for compiler
        run: |
          mkdir -p ext
          cp -r fonts ext/fonts

      - name: Setup Theos and Compile Tweak
        run: |
          export THEOS=/opt/theos
          make clean
          make package

      - name: Prepare Artifacts (Deb & Dylib together)
        run: |
          mkdir -p compiled_output
          cp packages/*.deb compiled_output/
          find .theos -name "*.dylib" -exec cp {} compiled_output/ \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: M7MD-Build-Files
          path: compiled_output/*
