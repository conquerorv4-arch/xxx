name: Build Tweak

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: parsuj/theos:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create ext/fonts structure for compiler
        run: |
          mkdir -p ext
          cp -r fonts ext/fonts

      - name: Setup Theos and Compile Tweak
        run: |
          export THEOS=/opt/theos
          make clean
          make package
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: compiled-deb-package
          path: packages/*.deb
