name: Build Tweak

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: parsuj/theos:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create ext/fonts structure for compiler
        run: |
          mkdir -p ext
          cp -r fonts ext/fonts

      - name: Setup Theos and Compile Tweak
        run: |
          export THEOS=/opt/theos
          make clean
          make package

      - name: Prepare Artifacts (Deb & Dylib together)
        run: |
          mkdir -p compiled_output
          # .deb faylını qovluğa kopyala
          cp packages/*.deb compiled_output/
          # .theos daxilindən .dylib faylını tapıb eyni qovluğa kopyala
          find .theos -name "*.dylib" -exec cp {} compiled_output/ \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: M7MD-Build-Files
          path: compiled_output/*
